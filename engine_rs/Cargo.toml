# GenAIRR engine — Rust kernel for the simulation engine.
#
# Built as a Python extension via PyO3 + maturin, exposed to Python
# under the module name `genairr_engine`.

[package]
name = "genairr_engine"
version = "0.0.1"
edition = "2021"
license = "GPL-3.0-or-later"
description = "GenAIRR simulation engine (Rust kernel)"
publish = false

[lib]
# rlib for cargo unit tests; cdylib for the Python extension.
crate-type = ["cdylib", "rlib"]
name = "genairr_engine"

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py39"] }
# Durable trace I/O. `serde` derives Serialize/Deserialize on the
# trace types; `serde_json` is the canonical on-disk format for
# `TraceFile` (the audit artifact).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Deterministic content hashing for the refdata signature inside
# `TraceFile`. SHA-256 is cryptographic strength — overkill for
# identity but the right tool when a hash mismatch is the only
# defense against silently replaying a trace against a drifted
# reference dataset.
sha2 = "0.10"

[dev-dependencies]
# Reserved for proptest / property-based tests.

[profile.release]
# Keep debug info so py-spy / samply can symbolicate native stacks inside
# the .so. No effect on codegen or optimizations.
#
# This alone is NOT enough to profile an installed build: pyproject.toml sets
# `[tool.maturin] strip = true`, so `maturin develop` and every wheel ship a
# stripped .so (4 MB rather than 65 MB, which is why the wheel keeps it that
# way). A profile of such a build symbolicates to bare addresses. To get a
# profiled build, bypass maturin and copy the artifact in:
#
#   cargo build --release --manifest-path engine_rs/Cargo.toml \
#         --features pyo3/extension-module
#   cp engine_rs/target/release/libgenairr_engine.so src/GenAIRR/_engine.abi3.so
#   py-spy record --native -- python your_workload.py
#   maturin develop --release -m engine_rs/Cargo.toml   # restore afterwards
#
# `perf` is not an alternative here: it needs a lower perf_event_paranoid than
# a stock desktop has, and the stripped .so exports one dynamic symbol.
debug = true
strip = "none"

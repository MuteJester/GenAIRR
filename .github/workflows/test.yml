name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # ── Python test matrix ─────────────────────────────────────────
  # Builds the unified GenAIRR wheel via maturin (Rust kernel as the
  # private GenAIRR._engine submodule + Python wrappers in one wheel)
  # and runs the pytest suite. abi3-py39 means one wheel covers every
  # Python version we test.
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            engine_rs/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('engine_rs/Cargo.toml', 'engine_rs/Cargo.lock') }}

      - name: Install maturin
        run: |
          python -m pip install --upgrade pip
          pip install "maturin>=1.5,<2.0"

      - name: Build & install GenAIRR wheel
        run: maturin build --release --out dist
      # Install with the test and mcp extras. Without [mcp] the MCP server
      # tests are skipped at collection, which also made this workflow
      # disagree with build-wheels.yml about what gets exercised.
      - name: Install built wheel with test extras
        shell: bash
        run: pip install "$(echo dist/genairr-*.whl)[test,mcp]"

      # -n auto distributes across the runner's cores. No -x: with xdist it
      # truncates reporting across workers and hides which one failed.
      # The wall-time budgets are excluded here and run on their own below:
      # under xdist the other workers saturate the cores, which inflates the
      # measured time and fails the budgets intermittently.
      - name: Run pytest
        env:
          HYPOTHESIS_PROFILE: ci
        run: pytest tests/ -q -n auto -m "not performance and not campaign"

      - name: Run wall-time budgets
        run: pytest tests/ -q -m performance

      # The coverage report is the artifact anyone quotes about which
      # biological mechanisms have verified truth. Collected over the WHOLE
      # suite, not tests/biology: coverage is claimed by registration and not
      # by location, so a registration living under components/ is invisible
      # to a biology-only run. The first version of this step ran
      # `pytest tests/biology` and published 15 verified where the suite
      # establishes 16, under-counting the one mechanism registered outside
      # that directory -- the exact thing "registration, not location" exists
      # to allow.
      - name: Report biological mechanism coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        env:
          HYPOTHESIS_PROFILE: ci
        run: pytest tests/ -q -n auto -m "not performance and not campaign" --biology-coverage

      # The discovery campaign. Draws pass stacks across the space the DSL
      # accepts and puts every applicable truth check over every record, so a
      # defect in an interaction nobody thought to test fails here with the
      # pipeline that produced it.
      #
      # The seed is derived from the commit: every commit explores new ground,
      # and a failure reproduces exactly from the seed the message prints. Not
      # derandomized, because a campaign that draws the same examples for ever
      # finds nothing new; not random either, because an unreproducible
      # failure on an unrelated pull request is how a campaign gets switched
      # off. The exhaustive pairwise matrix in the same module runs with the
      # rest of the suite above and needs no seed.
      - name: Discovery campaign (drawn pipelines)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        shell: bash
        env:
          HYPOTHESIS_PROFILE: campaign
        run: |
          SEED=$(( 0x$(git rev-parse HEAD | cut -c1-7) % 2147483647 ))
          echo "campaign seed: $SEED (from commit $(git rev-parse --short HEAD))"
          pytest tests/ -q -m campaign \
            --hypothesis-seed="$SEED" --hypothesis-show-statistics

      # The inventory gate. It hashes every test body, helper and
      # module-level constant in the base branch and in this tree, and fails
      # on any change `tools/inventory-declarations.json` does not account
      # for -- so a weakened assertion costs a declaration with a reason
      # instead of passing as a green suite. Pull requests only: on a push to
      # master the base and the tree are the same commit, and the gate would
      # be comparing master against itself.
      - name: Inventory gate (tests/ against the base branch)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' && github.event_name == 'pull_request'
        shell: bash
        run: |
          # The matrix checkout is shallow. Deepen only on this leg: the gate
          # needs the base commit to check it out, the other eleven do not.
          git fetch --no-tags --unshallow origin "${{ github.base_ref }}" \
            || git fetch --no-tags origin "${{ github.base_ref }}"
          python tools/inventory_gate.py check \
            --since "origin/${{ github.base_ref }}" --declarations

      # The package and the build tooling are linted beside the tests. Each
      # path has its own exemptions in pyproject's per-file ignores, with the
      # counts and the reason written there; what is NOT exempted is enforced
      # here, which is the only thing that keeps a fixed rule fixed.
      - name: Lint the test suite, the package and the tooling
        run: ruff check tests/ src/ tools/

  # ── Rust unit + integration tests ──────────────────────────────
  # Direct `cargo test` against the engine crate. Cheaper and more
  # focused than running the whole pytest suite to validate the
  # kernel.
  cargo_test:
    name: cargo test (engine_rs)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            engine_rs/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('engine_rs/Cargo.toml', 'engine_rs/Cargo.lock') }}

      - name: cargo test
        working-directory: engine_rs
        run: cargo test --all-features

name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # ── Python test matrix ─────────────────────────────────────────
  # Builds the unified GenAIRR wheel via maturin (Rust kernel as the
  # private GenAIRR._engine submodule + Python wrappers in one wheel)
  # and runs the pytest suite. abi3-py39 means one wheel covers every
  # Python version we test.
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            engine_rs/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('engine_rs/Cargo.toml', 'engine_rs/Cargo.lock') }}

      - name: Install maturin
        run: |
          python -m pip install --upgrade pip
          pip install "maturin>=1.5,<2.0"

      - name: Build & install GenAIRR wheel
        run: maturin build --release --out dist
      # Install with the test and mcp extras. Without [mcp] the MCP server
      # tests are skipped at collection, which also made this workflow
      # disagree with build-wheels.yml about what gets exercised.
      - name: Install built wheel with test extras
        shell: bash
        run: pip install "$(echo dist/genairr-*.whl)[test,mcp]"

      # -n auto distributes across the runner's cores. No -x: with xdist it
      # truncates reporting across workers and hides which one failed.
      # The wall-time budgets are excluded here and run on their own below:
      # under xdist the other workers saturate the cores, which inflates the
      # measured time and fails the budgets intermittently.
      - name: Run pytest
        env:
          HYPOTHESIS_PROFILE: ci
        run: pytest tests/ -q -n auto -m "not performance"

      - name: Run wall-time budgets
        run: pytest tests/ -q -m performance

      # The coverage report is the artifact anyone quotes about which
      # biological mechanisms have verified truth. Collected over the WHOLE
      # suite, not tests/biology: coverage is claimed by registration and not
      # by location, so a registration living under components/ is invisible
      # to a biology-only run. The first version of this step ran
      # `pytest tests/biology` and published 15 verified where the suite
      # establishes 16, under-counting the one mechanism registered outside
      # that directory -- the exact thing "registration, not location" exists
      # to allow.
      - name: Report biological mechanism coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        env:
          HYPOTHESIS_PROFILE: ci
        run: pytest tests/ -q -n auto -m "not performance" --biology-coverage

      # Scoped to tests/: see the per-file ignores in pyproject for why F401
      # cannot be enforced on test modules while shared fixtures are imported
      # by name.
      - name: Lint the test suite
        run: ruff check tests/

  # ── Rust unit + integration tests ──────────────────────────────
  # Direct `cargo test` against the engine crate. Cheaper and more
  # focused than running the whole pytest suite to validate the
  # kernel.
  cargo_test:
    name: cargo test (engine_rs)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            engine_rs/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('engine_rs/Cargo.toml', 'engine_rs/Cargo.lock') }}

      - name: cargo test
        working-directory: engine_rs
        run: cargo test --all-features

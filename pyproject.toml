# GenAIRR — unified Rust + Python package.
#
# The simulation kernel (Rust crate at engine_rs/) and the Python
# wrappers under src/GenAIRR/ ship together as a single wheel built by
# maturin. The Rust extension is exposed as the private submodule
# GenAIRR._engine; users import the public API from `GenAIRR`.
#
# Version is derived from the git tag at release time by a CI step that
# rewrites this file and engine_rs/Cargo.toml. For local development the
# values below are used as-is.

[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "GenAIRR"
version = "2.3.1"
description = "Synthetic immune-receptor-sequence simulator for benchmarking alignment models and sequence analysis."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "Thomas Konstantinovsky" },
    { name = "Ayelet Peres" },
]
maintainers = [
    { name = "Thomas Konstantinovsky", email = "thomaskon90@gmail.com" },
]
keywords = ["immunogenetics", "sequence simulation", "bioinformatics", "alignment benchmarking"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
]

[project.optional-dependencies]
dataconfig = ["numpy>=1.24", "scipy>=1.10"]
viz = ["graphviz>=0.20"]
mcp = ["fastmcp>=2.0,<4.0"]
# Test-only. Not part of `all`: installing GenAIRR to use it should not
# pull in a test runner.
test = [
    "pytest>=7.0",
    "pandas",
    "hypothesis>=6.100",
    "pytest-xdist>=3.5",
    # The official AIRR schema package. Six tests importorskip it, so without
    # it the headline schema-compliance claim is silently skipped and passes
    # only on machines that happen to have it installed.
    "airr>=1.4",
    "ruff>=0.6",
]
all = [
    "numpy>=1.24",
    "scipy>=1.10",
    "graphviz>=0.20",
    "tqdm>=4.60",
    "fastmcp>=2.0,<4.0",
]

[project.urls]
Homepage = "https://github.com/MuteJester/GenAIRR"
"Bug Tracker" = "https://github.com/MuteJester/GenAIRR/issues"

[tool.maturin]
# Mixed Rust + Python layout: maturin builds the Rust extension defined
# in engine_rs/Cargo.toml and bundles it next to the Python sources from
# src/GenAIRR/ in the same wheel.
manifest-path = "engine_rs/Cargo.toml"
python-source = "src"
module-name = "GenAIRR._engine"
features = ["pyo3/extension-module"]
strip = true
# Include reference data shipped inside the GenAIRR package. maturin
# would pick up most of this automatically since it lives under the
# python-source tree, but listing the globs explicitly guarantees the
# files end up in both the wheel and the sdist.
include = [
    { path = "src/GenAIRR/data/*.pkl", format = ["sdist", "wheel"] },
    { path = "src/GenAIRR/data/*.json", format = ["sdist", "wheel"] },
    { path = "src/GenAIRR/data/builtin_dataconfigs/*.pkl", format = ["sdist", "wheel"] },
    { path = "src/GenAIRR/data/builtin_dataconfigs/*.json", format = ["sdist", "wheel"] },
    { path = "src/GenAIRR/data/mutation_model_parameters/*.pkl", format = ["sdist", "wheel"] },
    { path = "src/GenAIRR/data/mutation_model_parameters/*.json", format = ["sdist", "wheel"] },
    # The packaged reference build: one zip archive of its dossier members.
    { path = "src/GenAIRR/data/published_references/human_igh_ogrdb_10_observed_v1.zip", format = ["sdist", "wheel"] },
    { path = "engine_rs/**/*", format = "sdist" },
    { path = "README.md", format = "sdist" },
    { path = "LICENSE", format = "sdist" },
]

[tool.pytest.ini_options]
# v2.0 DSL: `recombine()` warns when bound to a raw RefDataConfig
# (no empirical NP-length / trim distributions available). That's a
# real signal for end users, but the engine-level test suite uses
# minimal synthetic refdata on purpose. Ignore the two specific
# warnings by default so they don't drown the test log; tests that
# specifically validate the warning use `pytest.warns()` which is
# unaffected by these global filters.
filterwarnings = [
    "ignore:Experiment bound to a raw RefDataConfig with no empirical NP-length distribution.*:UserWarning",
    "ignore:Experiment bound to a raw RefDataConfig has no trim distributions.*:UserWarning",
]
# Custom markers registered to silence PytestUnknownMarkWarning.
# `performance` marks the budget tests in tests/performance/test_performance_budgets.py;
# skip with `pytest -m "not performance"` for fast CI.
# Tier markers classify every test module. They are orthogonal to the
# directory tree, so `-m pin` selects across the whole suite.
markers = [
    "performance: regression-guard wall-time budgets (see docs/performance_baseline.md).\n        Run serially, on their own: under xdist the other workers saturate the\n        cores and the measured time reflects contention, not the engine.",
    "pin: pins a live surface a feature reuses; fails when that surface shifts",
    "behavior: exercises a feature's own behavior",
    "composition: runs the feature against the full release stack",
    "slow: excluded from the fast path; run with the full suite",
    "biology: verifies a declared biological mechanism (see tests/biology)",
]

[tool.ruff]
# Scoped to the test suite: the package and the engine bindings are not part of
# this work, and a repo-wide sweep would bury the signal.
include = ["tests/**/*.py"]
line-length = 110

[tool.ruff.lint]
# F401 unused-import is the rule that matters here: the module splitter copied
# each source module's whole import block into every target, so several modules
# imported 40+ names and used a third of them. F811 is the same mess seen from
# the other side -- a name imported twice, once from the module's own block and
# once from the shared support module.
#
# E501 is deliberately not selected. There are 541 over-long lines, essentially
# all of them pre-existing in test bodies this work moved verbatim; enforcing it
# would mean rewriting hundreds of assertions, which is exactly what the
# restructure promised not to do. Reformatting them is its own change.
select = ["F", "E711", "E712", "E713", "E714", "E721", "W605"]
# F841 unused-variable: 13 instances, all pre-existing in test bodies, and
# several have a side-effecting right-hand side (building refdata, importing
# pandas). Deleting the assignment is a behaviour change dressed as a cleanup,
# and editing the body is the rewrite this work promised not to do.
ignore = ["F841"]

[tool.ruff.lint.per-file-ignores]
# Support packages re-export deliberately.
"tests/support/**/__init__.py" = ["F401"]
# Test modules cannot have unused-import enforced, and the reason is
# structural rather than cosmetic: this suite imports shared pytest fixtures by
# name so that pytest can resolve them, and such an import is syntactically
# indistinguishable from dead weight. tests/components/reference_sources/
# test_dossier.py imports 42 names on one line; `_raises` is used in code,
# `report`/`inventory`/`inv` are used as fixture parameters, and `ADAPTER` and
# `CLAIM_ID` are genuine leftovers from the module split. Running ruff --fix
# over that removed the fixture imports and broke 177 tests.
#
# F811 is the same cause seen from the other side: a name arriving both from
# the module's own import block and from the shared support module.
#
# The fix is not a lint setting. Moving the shared *fixtures* into a per-area
# conftest would make every remaining import genuinely used and let F401 be
# enforced here -- and would also remove the transitive-dependency trap where
# importing `inventory` without the `inv` it depends on errors at run time.
# That is a structural change, recorded in the remediation design as follow-on
# work rather than done under a lint flag.
# F541 too: an f-string with no placeholder is harmless to leave, and dropping
# the prefix edits a test body. The gate flagged exactly three such edits as
# unexplained changes, which is the gate working -- a cosmetic rewrite is still
# a rewrite, and bodies on this branch move verbatim.
"tests/**/test_*.py" = ["F401", "F811", "F541"]

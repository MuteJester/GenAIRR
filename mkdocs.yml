# MkDocs Material site configuration for GenAIRR docs.
#
# The site is live and built from `site_docs/`. Some deeper pages
# (a handful of concept/validation/cartridge-estimator stubs) are
# still being written; the nav below ships the pages that have
# content. The contract pins in
# `tests/acceptance/test_docs_mkdocs_migration_contract.py` guard structure.
#
# To build:
#   pip install -r requirements-docs.txt
#   mkdocs build --strict
#
# Existing live URLs at `mutejester.github.io/GenAIRR/<page>.html`
# are preserved via the `redirects` plugin block below.

site_name: GenAIRR
site_description: Synthetic immune-receptor-sequence simulator with absolute ground truth
site_url: https://mutejester.github.io/GenAIRR/
site_author: Thomas Konstantinovsky

repo_name: MuteJester/GenAIRR
repo_url: https://github.com/MuteJester/GenAIRR
edit_uri: edit/master/site_docs/

# Source directory deliberately separate from `audit-docs/` so the
# contributor-only audit and design markdowns there stay untouched
# and continue to render on GitHub. The user-facing site lives at
# `site_docs/`.
docs_dir: site_docs

# Emit `<page>.html` URLs (NOT `<page>/` clean-URLs). This is the
# URL contract the `redirects` plugin preserves — every existing
# `mutejester.github.io/GenAIRR/<page>.html` stays resolvable.
# With `use_directory_urls: false`,
# the `redirects` plugin's `'old.md': 'new.md'` entries emit a
# redirect file at `<old>.html` pointing at `<new>.html`, which
# is exactly what we need.
use_directory_urls: false

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.share
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  # Light-mode only — matching the existing `website/` site which
  # explicitly does NOT ship dark mode. The bench-science palette
  # (paper-white ground, ink near-black) is the canonical look.
  # Code windows are dark by composition, not by theme switch.
  palette:
    scheme: default
    primary: white      # Material's "white" disables its primary tint
                        # so our extra.css `--md-primary-fg-color` overrides
                        # paint the chrome with our `--ink` token.
    accent: green       # Closest Material accent to our --accent (#1f8a4c);
                        # extra.css overrides paint actual interactive states.
  font:
    # IBM Plex stack is the institutional identity. Material loads these
    # from Google Fonts automatically.
    text: IBM Plex Sans
    code: IBM Plex Mono
  icon:
    repo: fontawesome/brands/github

# GenAIRR theme layer — design tokens + component overrides that
# prevent the site from looking like default MkDocs Material. See
# site_docs/stylesheets/extra.css for the full stylesheet (sourced
# from website/styles.css).
extra_css:
  - stylesheets/extra.css

# Mermaid for architecture flow diagrams. Loaded as an ES module from
# CDN so we don't ship the (~1MB) library locally. The pymdownx
# custom_fences config above turns ```mermaid blocks into
# <pre class="mermaid"> elements; mermaid.run() picks them up.
extra_javascript:
  - js/mermaid-init.js
  - js/demo-presentation.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite

# Plugins (deps installable via
# `pip install -r requirements-docs.txt`).
#
# - `search` is provided by mkdocs core and enabled by default.
# - `redirects` carries the live-URL → MkDocs-route map, so every
#   existing `website/*.html` path stays resolvable.
# - `mkdocstrings` drives the generated API-reference pages under
#   `site_docs/reference/`.
# - `mkdocs-jupyter` is intentionally NOT enabled here. It's
#   listed in `requirements-docs.txt` so notebook tutorials can
#   flip it on without a separate dep install.
plugins:
  - search
  - redirects:
      redirect_maps:
        # Live-URL preservation. `mkdocs-redirects` treats the LEFT
        # key as a fake source path: it
        # generates a redirect HTML file at the URL MkDocs would have
        # produced for that path. With `use_directory_urls: false`, `foo.md`
        # → `foo.html`. So `'learn.md': 'getting-started/index.md'` emits
        # `<site>/learn.html` redirecting to `<site>/getting-started/index.html`
        # — preserving every live `mutejester.github.io/GenAIRR/<page>.html`.
        # 29 entries: one per existing website/*.html page, modulo
        # `index.html` which is the homepage itself (`/` already serves it).
        # NOTE: no 'learn.md' redirect — learn.md is a real nav page
        # ("Choose your path"); a redirect here would clobber the built
        # learn.html with a stub and make the page unreachable.
        "lesson-1.md": "getting-started/index.md"
        "lesson-2.md": "getting-started/index.md"
        "lesson-3.md": "getting-started/index.md"
        "lesson-4.md": "getting-started/index.md"
        "lesson-5.md": "getting-started/index.md"
        "concepts.md": "concepts/index.md"
        "concept-pipeline.md": "concepts/index.md"
        "concept-persistent-ir.md": "concepts/index.md"
        "concept-contracts.md": "concepts/index.md"
        "concept-airr-record.md": "concepts/airr-record.md"
        "concept-live-call.md": "concepts/index.md"
        "guides.md": "guides/index.md"
        "guide-build-config.md": "guides/build-reference-cartridge.md"
        "guide-productive.md": "guides/productive.md"
        "guide-clonal-families.md": "guides/clonal-families.md"
        "guide-v-usage.md": "guides/recombination-junction.md"
        "guide-tune-corruption.md": "guides/corruption-sequencing.md"
        "guide-export.md": "getting-started/export-results.md"
        "guide-streaming.md": "reference/index.md"
        "guide-with-metadata.md": "getting-started/export-results.md"
        "guide-audit-realism.md": "validation/index.md"
        "guide-benchmark-aligner.md": "validation/index.md"
        "guide-compare-shm.md": "validation/index.md"
        "guide-replay.md": "guides/trace-replay.md"
        "guide-reproduce.md": "guides/trace-replay.md"
        "guide-smoke-test.md": "validation/index.md"
        "guide-trace-introspection.md": "guides/trace-replay.md"
        "reference.md": "reference/index.md"
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true

# Navigation — curated path from beginner to contributor.
#
# Unwritten pages are intentionally NOT in nav. They stay on disk
# (the `redirects` plugin needs them as targets for live-URL
# preservation), but the user-visible nav lists only real content.
# As each one is written, add it back to nav here.
nav:
  - Home: index.md
  - Demo: demo.md
  - Choose your path: learn.md
  - Getting Started:
      - getting-started/index.md
      - Installation: getting-started/installation.md
      - Quick start: getting-started/quick-start.md
      - Your first AIRR record: getting-started/first-airr-record.md
      - Export the results: getting-started/export-results.md
  - Core Concepts:
      - concepts/index.md
      - AIRR Record: concepts/airr-record.md
      - Reference Cartridge (concept): concepts/reference-cartridge.md
  - Simulation Guides:
      - guides/index.md
      - The Experiment builder: guides/experiment-builder.md
      - Sample only productive sequences: guides/productive.md
      - Biology map: guides/biology-map.md
      - Recombination + junction biology: guides/recombination-junction.md
      - Retained coding end calibration: guides/coding-end-calibration.md
      - Experimental duplex repair: guides/experimental-duplex-repair.md
      - D inversion + receptor revision: guides/recombination-editing.md
      - Clonal simulation overview: guides/clonal-families.md
      - Clonal lineage trees: guides/clonal-lineage.md
      - Clonal repertoires (TCR & abundance): guides/clonal-repertoire.md
      - Genotypes (per-individual diploid): guides/genotype.md
      - Genotype sampling & population priors: guides/genotype-priors.md
      - Genotype cohorts: guides/genotype-cohorts.md
      - Benchmarking genotype inference: guides/genotype-benchmarking.md
      - Junction N/P additions: guides/junction-additions.md
      - Targeted SHM rates: guides/shm-targeting.md
      - Corruption + sequencing artefacts: guides/corruption-sequencing.md
      - Paired-end reads and FASTQ: guides/paired-end-fastq.md
      - Portable local references: guides/portable-references.md
      - Published germline sources: guides/published-references.md
  - Reference Cartridge Authoring:
      - cartridges/index.md
      - Reference evidence and quarantine: cartridges/reference-evidence.md
      - Build a reference cartridge: guides/build-reference-cartridge.md
      - Estimate models from data: guides/estimate-cartridge-models.md
      - Inspect manifest + build report: guides/cartridge-manifest-report.md
  - Validation & Debugging:
      - validation/index.md
      - validate_records: validation/validate-records.md
      - Trace, replay, reproducibility: guides/trace-replay.md
  - API Reference:
      - Overview: reference/index.md
      - Experiment: reference/experiment.md
      - SimulationResult: reference/simulation-result.md
      - Reference (portable): reference/reference.md
      - ReferenceCartridgeBuilder: reference/reference-cartridge-builder.md
      - Reference models and rules: reference/reference-models.md
  - Architecture (Contributor):
      - architecture/index.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/MuteJester/GenAIRR
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/GenAIRR/

